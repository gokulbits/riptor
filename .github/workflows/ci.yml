name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Advisories and yanks land between pushes; catch them before the next tag.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  # The weekly run shouldn't cancel a push run on main, or the reverse.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job has a limit; GitHub's default is six hours.
  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  check:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Week for the package cache
        if: runner.os == 'Linux'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-22.04-${{ steps.week.outputs.week }}
          restore-keys: apt-debs-ubuntu-22.04-
      - name: Linux system deps
        if: runner.os == 'Linux'
        # A hung mirror can hold a job for hours; a slow one still needs time to finish.
        timeout-minutes: 30
        run: |
          # Packages from earlier runs, so a slow mirror only serves what changed.
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # Under sudo, so the timeout can stop apt-get; -k kills it if it ignores the first signal.
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
          for try in 1 2 3; do
            if sudo timeout -k 15 180 $apt update \
              && sudo timeout -k 15 900 $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev; then
              mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/
              exit 0
            fi
            echo "apt-get failed (try $try), retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Frontend typecheck, lint + tests
        run: |
          npm run typecheck
          npm run lint
          npm test --if-present

      - name: Build frontend
        run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Builds on the rust-version Cargo.toml promises.
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Week for the package cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Linux packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-22.04-${{ steps.week.outputs.week }}
          restore-keys: apt-debs-ubuntu-22.04-
      - name: Linux system deps
        # A hung mirror can hold a job for hours; a slow one still needs time to finish.
        timeout-minutes: 30
        run: |
          # Packages from earlier runs, so a slow mirror only serves what changed.
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # Under sudo, so the timeout can stop apt-get; -k kills it if it ignores the first signal.
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
          for try in 1 2 3; do
            if sudo timeout -k 15 180 $apt update \
              && sudo timeout -k 15 900 $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev; then
              mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/
              exit 0
            fi
            echo "apt-get failed (try $try), retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - name: Install the minimum Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo +"$MSRV" check --workspace --all-targets --locked

  # Full-LTO builds are slow: tags and manual runs only.
  bundle:
    needs: [check, msrv, security]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Week for the package cache
        if: runner.os == 'Linux'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Linux packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-22.04-${{ steps.week.outputs.week }}
          restore-keys: apt-debs-ubuntu-22.04-
      - name: Linux system deps
        if: runner.os == 'Linux'
        # A hung mirror can hold a job for hours; a slow one still needs time to finish.
        timeout-minutes: 30
        run: |
          # Packages from earlier runs, so a slow mirror only serves what changed.
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          # Under sudo, so the timeout can stop apt-get; -k kills it if it ignores the first signal.
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Keep-Downloaded-Packages=true"
          for try in 1 2 3; do
            if sudo timeout -k 15 180 $apt update \
              && sudo timeout -k 15 900 $apt install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev; then
              mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/
              exit 0
            fi
            echo "apt-get failed (try $try), retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # externalBin wants a target-triple suffix.
      - name: Build VPN helper
        shell: bash
        run: |
          cargo build --release --locked -p riptor-vpn-helper
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          # Windows shows the file name in the admin prompt.
          name=$([ "$RUNNER_OS" = Windows ] && echo "Riptor VPN Service" || echo riptor-vpn-helper)
          mkdir -p src-tauri/binaries
          cp "target/release/riptor-vpn-helper$ext" "src-tauri/binaries/$name-$triple$ext"
          # Headless mode ships in the Linux packages.
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p riptor-daemon
            cp target/release/riptord "src-tauri/binaries/riptord-$triple"
            cp target/release/riptor-cli "src-tauri/binaries/riptor-cli-$triple"
          fi
      # Hash is pinned in the script; the signature check is a second gate.
      - name: Fetch OpenVPN installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/fetch-openvpn.mjs
          $sig = Get-AuthenticodeSignature src-tauri/windows/openvpn/openvpn.msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=OpenVPN Inc\.,') {
            throw "OpenVPN installer signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
      - name: Fetch embeddable Python
        if: runner.os == 'Windows'
        run: node scripts/fetch-python.mjs
      - name: Build installers
        shell: bash
        # The Windows setup is signed for the in-app updater (not Authenticode).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.os == 'Windows' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          extra=$([ "$RUNNER_OS" = Windows ] && echo "--config src-tauri/tauri.bundle.windows.conf.json" || true)
          npx tauri build --config src-tauri/tauri.bundle.conf.json $extra -- --locked
      - name: SHA-256 sums
        shell: bash
        run: |
          cd target/release/bundle
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} + > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riptor-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/SHA256SUMS-*.txt

  # Drafts only; a person publishes. The only job with write access.
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir dist
          find artifacts -type f \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -la dist
          version="${TAG#v}"
          for pattern in "*_${version}_x64-setup.exe" "*_${version}_amd64.deb" "*-${version}-*.x86_64.rpm"; do
            n=$(find dist -name "$pattern" | wc -l)
            [ "$n" = 1 ] || { echo "expected one $pattern in dist (found $n): does the tag match the app version?"; exit 1; }
          done
          # The in-app updater reads this from the latest published release.
          setup="Riptor_${version}_x64-setup.exe"
          [ -f "dist/$setup.sig" ] || { echo "missing $setup.sig: is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; }
          jq -n --arg v "$version" --arg sig "$(cat "dist/$setup.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: "See the release notes on GitHub.", pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > dist/latest.json
          rm "dist/$setup.sig"
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          for sums in ../artifacts/*/SHA256SUMS-*.txt; do
            while read -r sum path; do
              name=$(basename "${path#\*}")
              awk -v s="$sum" -v n="$name" '$1 == s && ($2 == n || $2 == "*" n) { ok = 1 } END { exit !ok }' SHA256SUMS.txt \
                || { echo "checksum mismatch for $name"; exit 1; }
            done < "$sums"
          done
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          ## Install

          - **Windows 10/11 (64-bit):** download \`Riptor_${TAG#v}_x64-setup.exe\` and run it. It installs Riptor for all users and sets up everything the VPN and search plugins need (OpenVPN and Python are included; see THIRD-PARTY-NOTICES.md).
          - **Debian / Ubuntu:** \`sudo apt install ./Riptor_${TAG#v}_amd64.deb\`
          - **Fedora / openSUSE:** \`sudo dnf install ./Riptor-${TAG#v}-1.x86_64.rpm\` (or \`zypper install\`)

          The Linux packages pull in their dependencies (openvpn, python3, bubblewrap, pkexec) through your package manager.

          Verify downloads against \`SHA256SUMS.txt\`, e.g. \`sha256sum -c SHA256SUMS.txt --ignore-missing\`.
          NOTES
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
              --title "Riptor ${TAG#v}" --notes-file notes.md --generate-notes
          fi
