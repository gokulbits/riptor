name: CI

on:
  push:
    branches: [main]
    # Version tags (e.g. v0.1.0) also build the installers.
    tags: ["v*"]
  pull_request:
  # "Run workflow" button: runs the checks and builds the installers.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Frontend typecheck + tests
        run: |
          npm run typecheck
          npm test --if-present

      - name: Build frontend
        run: npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Release builds (full LTO) are slow, so installers are only built for
  # version tags and manual runs; every push still gets the checks above.
  bundle:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The VPN helper ships next to riptor.exe (Tauri externalBin wants a
      # target-triple suffix). Kept out of tauri.conf.json so dev builds and
      # cargo test don't need the file.
      - name: Build VPN helper
        shell: bash
        run: |
          cargo build --release -p riptor-vpn-helper
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p src-tauri/binaries
          cp "target/release/riptor-vpn-helper$ext" "src-tauri/binaries/riptor-vpn-helper-$triple$ext"
      # The Windows setup carries the official OpenVPN installer. The script
      # pins its SHA-256; the signature check is a second, independent gate.
      - name: Fetch OpenVPN installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/fetch-openvpn.mjs
          $sig = Get-AuthenticodeSignature src-tauri/windows/openvpn/openvpn.msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=OpenVPN Inc\.,') {
            throw "OpenVPN installer signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
      # Search plugins need Python; the Windows setup ships the pinned
      # embeddable Python (hash checked against crates/riptor-search/src/pyembed.rs).
      - name: Fetch embeddable Python
        if: runner.os == 'Windows'
        run: node scripts/fetch-python.mjs
      - name: Build installers
        shell: bash
        run: |
          extra=$([ "$RUNNER_OS" = Windows ] && echo "--config src-tauri/tauri.bundle.windows.conf.json" || true)
          npx tauri build --config src-tauri/tauri.bundle.conf.json $extra
      - name: SHA-256 sums
        shell: bash
        run: |
          cd target/release/bundle
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} + > SHA256SUMS-${{ runner.os }}.txt
          cat SHA256SUMS-${{ runner.os }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riptor-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/SHA256SUMS-*.txt

  # Version tags turn the installers into a *draft* GitHub release. Nothing is
  # public until someone reviews the draft and clicks Publish. Only this job
  # can write to the repo, and it uses the preinstalled gh CLI (no extra
  # third-party actions).
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir dist
          find artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -la dist
          # One of each, and built from the version the tag names.
          version="${TAG#v}"
          for pattern in "*_${version}_x64-setup.exe" "*_${version}_amd64.deb" "*-${version}-*.x86_64.rpm"; do
            n=$(find dist -name "$pattern" | wc -l)
            [ "$n" = 1 ] || { echo "expected one $pattern in dist (found $n): does the tag match the app version?"; exit 1; }
          done
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # The files must be exactly what the build jobs hashed.
          for sums in ../artifacts/*/SHA256SUMS-*.txt; do
            while read -r sum path; do
              name=$(basename "${path#\*}")
              awk -v s="$sum" -v n="$name" '$1 == s && ($2 == n || $2 == "*" n) { ok = 1 } END { exit !ok }' SHA256SUMS.txt \
                || { echo "checksum mismatch for $name"; exit 1; }
            done < "$sums"
          done
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          ## Install

          - **Windows 10/11 (64-bit):** download \`Riptor_${TAG#v}_x64-setup.exe\` and run it. It installs Riptor for all users and sets up everything the VPN and search plugins need (OpenVPN and Python are included; see THIRD-PARTY-NOTICES.md).
          - **Debian / Ubuntu:** \`sudo apt install ./Riptor_${TAG#v}_amd64.deb\`
          - **Fedora / openSUSE:** \`sudo dnf install ./Riptor-${TAG#v}-1.x86_64.rpm\` (or \`zypper install\`)

          The Linux packages pull in their dependencies (openvpn, python3, bubblewrap, pkexec) through your package manager.

          Verify downloads against \`SHA256SUMS.txt\`, e.g. \`sha256sum -c SHA256SUMS.txt --ignore-missing\`.
          NOTES
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run: replace the files on the existing (draft) release.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
              --title "Riptor ${TAG#v}" --notes-file notes.md --generate-notes
          fi
