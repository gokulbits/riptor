name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The image is published when a person publishes a release, never from a tag alone.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          DOCKER_BUILDKIT=1 docker build \
            --platform "linux/$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=Riptor headless BitTorrent client with remote control" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t riptor:test .

      - name: Smoke test
        run: |
          set -euo pipefail
          wait_healthy() {
            for _ in $(seq 1 90); do
              [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ] || { docker logs "$1"; echo "$1 stopped"; return 1; }
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0
              sleep 2
            done
            docker logs "$1"; echo "$1 never became healthy"; return 1
          }
          docker run -d --name riptor --health-interval 3s \
            -e RIPTOR_WEBUI_PASSWORD=smoke-test-password \
            -p 127.0.0.1:18080:8080 riptor:test
          wait_healthy riptor
          docker exec riptor riptor-cli stats
          docker exec riptor riptor-cli list
          # riptord dropped to PUID and owns its data.
          [ "$(docker exec riptor stat -c %u /proc/1)" = 1000 ]
          [ "$(docker exec riptor stat -c %u /config/settings.json)" = 1000 ]
          url=https://127.0.0.1:18080/api/v2
          for _ in $(seq 1 15); do curl -sk -o /dev/null "$url/app/version" && break; sleep 1; done
          [ "$(curl -sk -c jar --data-urlencode username=admin --data-urlencode password=wrong-password "$url/auth/login")" != "Ok." ]
          [ "$(curl -sk -c jar --data-urlencode username=admin --data-urlencode password=smoke-test-password "$url/auth/login")" = "Ok." ]
          curl -fsSk -b jar "$url/app/version"
          curl -fsSk -b jar "$url/torrents/info"
          # The web interface, search engines and RSS are all there.
          curl -fsSk https://127.0.0.1:18080/ | grep -q "web/app.js"
          curl -fsSk -b jar "$url/search/plugins" | grep -q archive
          curl -fsSk -b jar "$url/rss/items" | grep -q "{"
          [ "$(curl -sk -o /dev/null -w '%{http_code}' "$url/rss/items")" = 403 ]
          docker stop -t 30 riptor
          [ "$(docker inspect -f '{{.State.ExitCode}}' riptor)" = 0 ] || { docker logs riptor; exit 1; }

          # No password given: one is made and logged once.
          docker run -d --name fresh --health-interval 3s riptor:test
          wait_healthy fresh
          docker logs fresh 2>&1 | grep -q "Riptor made one"
          docker restart fresh
          wait_healthy fresh
          [ "$(docker logs fresh 2>&1 | grep -c "Riptor made one")" = 1 ]
          docker rm -f fresh riptor

      - name: Push
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "unexpected tag $TAG"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riptor"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag riptor:test "$image:${TAG#v}-$ARCH"
          docker push "$image:${TAG#v}-$ARCH"

  manifest:
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: One tag for both architectures
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/riptor"
          v="${TAG#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$image:$v")
          [ "$PRERELEASE" = true ] || tags+=(-t "$image:latest")
          docker buildx imagetools create "${tags[@]}" "$image:$v-amd64" "$image:$v-arm64"
          docker buildx imagetools inspect "$image:$v"
