[package]
name = "riptor-core"
description = "Riptor's torrent engine: librqbit session, stats, seeding policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
futures.workspace = true
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
librqbit-bencode = "9.0.1"
librqbit-dht = "9.0.1"
librqbit-tracker-comms = "9.0.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
url.workspace = true
riptor-net = { path = "../riptor-net" }
bytes.workspace = true
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "9.0.1", default-features = false }
riptor-storage = { path = "../riptor-storage" }
riptor-seeding = { path = "../riptor-seeding" }
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
argon2 = "0.6"
flate2 = "1"
base64 = "0.23"
thiserror.workspace = true
sha1 = "0.10"
sha2 = "0.11"
md5 = { package = "md-5", version = "0.11" }
crc32fast = "1"
network-interface = "2"

[target.'cfg(unix)'.dependencies]
rlimit = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Networking_Connectivity", "Foundation_Collections"] }

[dev-dependencies]
tempfile.workspace = true
rand = "0.10"
librqbit-dualstack-sockets = "0.7"
base64 = "0.23"
