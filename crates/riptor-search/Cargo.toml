[package]
name = "riptor-search"
description = "Search providers for Riptor: Internet Archive, Torznab, nova3 plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
url.workspace = true
quick-xml = "0.42"
sha2 = "0.11"
librqbit-core = { version = "9.0.1", default-features = false, features = ["sha1-ring"] }
librqbit-bencode = "9.0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
bytes.workspace = true
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
