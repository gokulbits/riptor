# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are only an error when we depend on them directly.
# Current transitive ones (proc-macro-error via gtk-rs, zbus_names/zvariant via
# D-Bus) have no maintained replacement upstream yet.
unmaintained = "workspace"
ignore = [
  # ringbuf <0.5.2 double free in Consumer::skip/clear, only when an element's
  # Drop panics. Our sole user (librqbit-utp 0.7) stores `u8`, which has no
  # Drop, so the bug is unreachable; uTP is also off by default. Remove when
  # librqbit-utp moves to ringbuf >= 0.5.2.
  { id = "RUSTSEC-2026-0293", reason = "unreachable: ringbuf element type is u8 (no Drop)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
