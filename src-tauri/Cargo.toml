[package]
name = "riptor"
description = "Lightweight, feature-rich BitTorrent client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "riptor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
url.workspace = true
zeroize = "1"
riptor-core = { path = "../crates/riptor-core" }
riptor-net = { path = "../crates/riptor-net" }
riptor-webapi = { path = "../crates/riptor-webapi" }
riptor-search = { path = "../crates/riptor-search" }
riptor-rss = { path = "../crates/riptor-rss" }
riptor-vpn = { path = "../crates/riptor-vpn" }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-plugin-updater = "2"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry"] }

# tauri-plugin-deep-link 2.6.2 initialises rust-ini's ParseOption with only
# the fields that existed in 0.21.1; 0.21.2 added more in a minor release and
# breaks the Linux build. Remove this pin once deep-link is fixed upstream.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "pty", "event", "fs"] }
rust-ini = "=0.21.1"
